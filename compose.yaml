# pdf-rag —— 单容器单进程:Web UI + HTTP API + MCP 全在后端进程内。
#
# MCP 挂在 /mcp(与 API 同端口 8100),不再单开 8101 容器 —— 省掉一个完整的
# Python 进程(它要各自加载 lancedb/pyarrow/fitz,实测两个进程各占约 650MiB)。
# 需要退回双进程时:后端设 MCP_INPROC=0,再起一个 mcp 服务跑 server.py(见文末注释)。
#
# 手册库与运行数据分离(推荐布局):
#   ${MANUALS_HOST_DIR:-../manuals} = 手册正本,挂到容器 /manuals,
#                  由 .env 的 PDF_ROOT=/manuals 指过去 —— 手册可独立备份/共用,
#                  升级或迁移本项目都不动它。
#                  改路径不必动本文件:在同目录放一个 .env.compose(或导出环境变量)
#                  MANUALS_HOST_DIR=/your/manuals/path 即可。
#                  也可把手册放进 ./pdf 用默认布局(留空 PDF_ROOT,不挂 /manuals)。
#   ./index.lance ./parsed ./logs ./data = 本项目自己的运行数据。
#
# 首次部署:
#   cp .env.example .env   # 填 EMBED_API_KEY 等
#   docker compose up -d --build
#
# uid 说明:容器以 1000:1000 运行(避免容器写 logs/ data/ 后在宿主变成 root 属主)。
# 若你的存储卷属主不是 uid 1000,改下面的 user: 或加 userns 配置。

services:
  pdf-rag:
    build: .
    image: pdf-rag:latest
    container_name: pdf-rag
    restart: unless-stopped
    user: "1000:1000"
    ports:
      - "8100:8100"
    environment:
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: "8100"
      MCP_INPROC: "1"          # MCP 挂到本进程的 /mcp
      MCP_PATH: /mcp
      TZ: Asia/Shanghai
    volumes:
      - ./.env:/app/.env:ro
      # 手册正本(只读挂载,应用不写它)。路径由 MANUALS_HOST_DIR 指定,
      # 未设置时用 ../manuals。
      - ${MANUALS_HOST_DIR:-../manuals}:/manuals:ro
      - ./index.lance:/app/index.lance
      - ./parsed:/app/parsed
      - ./logs:/app/logs
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/api/stats', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

# ---- 可选的"双进程"形态(仅在需要 MCP 独立扩容/隔离时启用) ----
